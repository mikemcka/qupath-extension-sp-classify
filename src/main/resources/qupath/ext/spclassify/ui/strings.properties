# Channel mapping editor (class -> review display channels)
menu.channel.mapping = Channel Mapping (Review Display)...
channelmap.title = Channel Mapping
channelmap.intro = Choose which channels review mode shows for each class. Classes come from this project and channels from the open image, so nothing has to be typed. Entries imported from a marker-table CSV are marked [CSV] and matched by name; tick or untick a channel (or use Pin) to switch an entry to exact channel names.
channelmap.noimage = Open an image first — its channels are the ones you can choose from.
channelmap.noimage.short = No image open
channelmap.image = Image: %s (%d channels)
channelmap.scan = Scan project channels
channelmap.scan.tooltip = Read the channel names of every image in the project, so channels missing from some images are listed and flagged. This opens every image and can be slow on large projects.
channelmap.scan.cancel = Cancel scan
channelmap.scan.progress = Scanning %d / %d…
channelmap.scan.cancelled = Scan cancelled
channelmap.scan.done = Scanned %d images: %d channel names, %d not in every image
channelmap.scan.failed = \ (%d could not be opened — see log)
channelmap.classes = Classes
channelmap.selectclass = Select a class
channelmap.channelsfor = Channels shown for "%s"
channelmap.filter = Filter channels…
channelmap.notinimage = not in this image
channelmap.orphan.tag = (not a project class)
channelmap.clear = Clear
channelmap.clear.tooltip = Remove this class's channel mapping (an entry for a class not in the project is deleted).
channelmap.pin = Pin matches
channelmap.pin.tooltip = Replace this entry's name-matched CSV markers with the exact channels they currently resolve to.
channelmap.pinall = Pin all matches
channelmap.pinall.tooltip = Pin every entry's name matches to exact channel names on this image.
channelmap.pin.unresolved = These CSV marker names matched no channel in this image and were dropped:
channelmap.preview = Preview
channelmap.preview.tooltip = Show this class's channels in the viewer now.
channelmap.preview.nothing = Nothing to preview — no channels set for this class
channelmap.preview.nomatch = Preview: no channel in this image matched
channelmap.preview.shown = Preview: showing %s
channelmap.manychannels = ⚠ %d channels — the composite may be hard to read
channelmap.import = Import CSV…
channelmap.import.tooltip = Load a marker-table CSV (same formats as Import → Marker Table). Replaces the mapping shown here; nothing is saved until you press Save.
channelmap.import.confirm = Replace the mapping shown here with the CSV's contents?
channelmap.import.summary = Loaded %s: %d exact, %d approximate, %d unmatched, %d not project classes
channelmap.export = Export CSV…
channelmap.export.done = Exported %s
channelmap.save = Save
channelmap.cancel = Cancel
channelmap.saved = Channel mapping saved (%d classes)
channelmap.discard = Discard your unsaved channel-mapping changes?
channelmap.note.orphan = "%s" is not a class in this project or classifier. It is kept unless you Clear it.
channelmap.note.renamed = Imported as "%s"; will be saved under the class name "%s".
channelmap.note.rule = Gating rule: %s (kept unchanged).
channelmap.note.legacy = From the marker table: %s — matched to channels by name.
channelmap.note.nomatch = ✗ "%s" matches no channel in this image.
channelmap.note.fuzzy = ~ "%s" matched only by partial name → %s. Check this is right, then Pin.
channelmap.note.explicit = Exact channels — matched by name first, so a mapping made here also works on images with the same channel names.
channelmap.note.missing = %d of these channels are not in this image (kept for other images).
channelmap.note.cleared = No channels — review leaves the display unchanged for this class.
channelmap.note.cleared.rule = No exact channels — review falls back to the markers in the gating rule.
channelmap.note.unmapped = No channels set — review leaves the display unchanged for this class. Tick channels to add them.
channelmap.status.exact = Every channel matched exactly
channelmap.status.normalized = Every channel matched (ignoring case/spacing/punctuation)
channelmap.status.fuzzy = Some channels matched only by partial name — may show the wrong channel
channelmap.status.partial = Some channels match nothing in this image
channelmap.status.unmatched = No channel in this image matches
channelmap.status.unmapped = No channels set
channelmap.edit.button = Edit channel mapping…
channelmap.edit.tooltip = Choose which channels are shown for each class (opens the Channel Mapping editor).
channelmap.status.notable = No channel mapping set — use Edit channel mapping… to choose channels per class.
channelmap.status.unmapped.class = No channels mapped for "%s"
channelmap.status.nomatch.class = No channel in this image matches "%s"'s mapping — display unchanged
channelmap.status.showing = %s → %s
channelmap.projectchanged = The project changed while this editor was open, so the mapping was not saved (it belongs to the previous project). Close this window and reopen Channel Mapping.

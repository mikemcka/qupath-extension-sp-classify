# Parameters
param.num_rounds.label  = Rounds:
param.num_rounds.help   = Maximum number of boosting rounds\n\n\
    With Early stopping ON (the default) this is a LIMIT, not a target:\n\
    each model stops as soon as it stops improving, so raising it is\n\
    usually free. Leave at 500.\n\n\
    With Early stopping OFF it is used literally, and every round is\n\
    trained — 500 rounds will take far longer than 200.
param.max_depth.label   = Max depth:
param.max_depth.help    = Maximum tree depth\n\n\
    Controls model complexity. 5-8 is typical.\n\
    Higher values risk overfitting on small label sets.

